<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Issue</title>
 <link rel="stylesheet" href="Styling/styles.css"/>
</head>

<body>
  <header class="top">
    <div class="shell head"><a href="index.html">← Main Menu</a>
      <div>
        <p class="eyebrow">CASE MANAGER WORKBENCH</p>
        <h1>Issue</h1>
        <p>Guided Issue process workspace</p>
      </div>
    </div>
  </header>
  <main class="shell app">
    <section class="card">
      <h2>Issue Setup</h2>
      <div class="grid four"><label>Insured Name<input id="issueInsured"></label><label>Policy Number<input
            id="issuePolicy"></label><label>System<select id="issueSystem">
            <option>WinRisk</option>
            <option>TPP</option>
          </select></label><label>Contract State<input id="issueState" maxlength="2"></label></div>
    </section>
    <div class="issue-layout">
      <section class="card">
        <h2>Issue Checklist <span id="issueProgress" class="badge">0%</span></h2>
        <div id="issueChecklist"></div>
      </section>
      <aside class="sticky">
        <section class="card warning"><b>!</b>
          <div>
            <h2>Issue Workspace Foundation</h2>
            <p>PLACEHOLDER.</p>
          </div>
        </section>
        <section class="card">
          <h2>Issue Notes</h2><textarea id="issueNotes" rows="12"></textarea>
          <div class="buttons"><button class="secondary" id="copyNotes">Copy Notes</button><button class="quiet"
              id="resetIssue">Reset</button></div>
          <p id="issueStatus" class="status"></p>
        </section>
      </aside>
    </div>
  </main>
  <script src="scripts/issue.js"></script>
</body>
<footer>

</footer>

</html>
